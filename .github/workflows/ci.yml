name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Check shell syntax
        shell: bash
        run: |
          for script in skills/*/scripts/*.sh; do
            bash -n "$script"
          done
      - name: Validate plugin manifests
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path(".claude-plugin").glob("*.json"):
              json.loads(path.read_text())
          PY
      - name: Install terminal emulator for wizard tests
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r skills/e2e-wizard/requirements.txt
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
